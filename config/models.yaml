# Model registry. `default` is used when a speech request does not name a model, `default_sfx` when a
# sound-effect request (POST /v1/sfx/jobs) does not. `kind` is tts (speech, the default) or sfx.
default: moss-tts-local-v1.5
default_sfx: moss-sfx-v2.0

models:
  moss-tts-local-v1.5:
    adapter: moss_local
    description: MOSS-TTS-Local-Transformer-v1.5（約 4B，BF16，48 kHz 立體聲，31 語言）
    repo: OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5
    revision: be7766a6735b98bd793f7c79fb720b4d0f5d13b8
    codec_repo: OpenMOSS-Team/MOSS-Audio-Tokenizer-v2
    codec_revision: f6e20e543b33d2c252a7ef71bdf8aa71e5ff9169
    # HF remote code defaults to bf16, the GitHub copy to fp32 — always set it explicitly.
    codec_weight_dtype: bf16
    # Official sampling parameters.
    sampling:
      audio_temperature: 1.7
      audio_top_p: 0.8
      audio_top_k: 25
      audio_repetition_penalty: 1.0
    # Hard upper bound on frames per segment (12.5 frames/s). Per-segment budgets are derived
    # from the estimated duration and never exceed this.
    max_new_tokens: 4096
    # Segments whose first attempt is generated in one batch once the voice is fixed (1 = off). B=4 was
    # ~2.4x and B=8 ~3.5x faster for +0.7 / +1.6-2.1 GiB of GPU memory (docs/batch-bench-report.md);
    # a batch that runs out of memory falls back to one segment at a time. The same seed reproduces
    # the same audio only with the same batch_size. Override per machine with LOCAL_TTS_BATCH_SIZE.
    batch_size: 1

  moss-sfx-v2.0:
    kind: sfx
    adapter: moss_sfx
    description: MOSS-SoundEffect v2.0（文字生成音效，48 kHz 單聲道，每段最長 30 秒）
    repo: OpenMOSS-Team/MOSS-SoundEffect-v2.0
    revision: e35df4d82fbe87fcd5d14e5d100e349c0c3c076d
    # The model runs in its own environment (its pins conflict with the service's): a persistent worker
    # subprocess started with <worker>/.venv/bin/python <worker>/worker.py. Path relative to the project root.
    # Install: uv sync --frozen --project workers/moss-sfx
    worker: workers/moss-sfx
    # Longest clip the model generates (it always denoises a 30 s latent and crops it).
    max_seconds: 30
    sample_rate: 48000
    # Official sampling parameters (num_inference_steps and cfg_scale can be set per request).
    sampling:
      num_inference_steps: 100
      cfg_scale: 4.0
      sigma_shift: 5.0
    # torch.compile of the DiT: ~14 s per clip compiled vs. >= 36 s uncompiled, for a slower first load
    # (compiled kernels are cached under the user cache dir). Needs a C compiler; without one the worker
    # runs uncompiled and says so in /health and in each job's warnings. Override per machine with
    # LOCAL_TTS_SFX_COMPILE=0/1.
    compile: true
    # A worker that does not report ready (load + compile warm-up) or answer one clip within these
    # many seconds is treated as hung: it is killed and the job fails.
    load_timeout_seconds: 1800
    generate_timeout_seconds: 600
